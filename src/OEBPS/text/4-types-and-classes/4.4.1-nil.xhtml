<section>
<h3 id="DictEntry_nil_336" class="entry"><span class="secno">4.4.1</span> <span class="names"><span id="nil" data-symbol="nil">nil</span></span> <span class="kind">Type</span></h3>
<dl>


<dt><b>Supertypes:</b></dt><dd>

all <i><a href="../26-glossary/t.xhtml#type">types</a></i>

</dd><dt><b>Description:</b></dt><dd>

The <i><a href="../26-glossary/t.xhtml#type">type</a></i> <a href="#DictEntry_nil_336"><b>nil</b></a> contains no <i><a href="../26-glossary/o.xhtml#object">objects</a></i> and so is also
called the <i><a href="../26-glossary/e.xhtml#emptytype">empty type</a></i>.

The <i><a href="../26-glossary/t.xhtml#type">type</a></i> <a href="#DictEntry_nil_336"><b>nil</b></a> is a <i><a href="../26-glossary/s.xhtml#subtype">subtype</a></i> of every <i><a href="../26-glossary/t.xhtml#type">type</a></i>.
No <i><a href="../26-glossary/o.xhtml#object">object</a></i> is of <i><a href="../26-glossary/t.xhtml#type">type</a></i> <a href="#DictEntry_nil_336"><b>nil</b></a>.

</dd><dt><b>Notes:</b></dt><dd>

The <i><a href="../26-glossary/t.xhtml#type">type</a></i> containing the <i><a href="../26-glossary/o.xhtml#object">object</a></i> <a href="#DictEntry_nil_336"><b>nil</b></a> is the <i><a href="../26-glossary/t.xhtml#type">type</a></i> <a href="../14-conses/14.2.2-null.xhtml#DictEntry_null_915"><b>null</b></a>,
not the <i><a href="../26-glossary/t.xhtml#type">type</a></i> <a href="#DictEntry_nil_336"><b>nil</b></a>.

</dd></dl>
</section>
