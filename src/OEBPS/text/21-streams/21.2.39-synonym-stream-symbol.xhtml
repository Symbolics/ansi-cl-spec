<h3 id="DictEntry_synonym_stre_1230" class="entry"><span class="secno">21.2.39</span> <span class="names"><span id="synonym-stream-symbol" data-symbol="synonym-stream-symbol">synonym-stream-symbol</span></span> <span class="kind">Function</span></h3>
<dl>


<dt><b>Syntax:</b></dt><dd>

<b>synonym-stream-symbol</b>
<i>synonym-stream</i>
  → <i>symbol</i>
</dd><dt><b>Arguments and Values:</b></dt><dd>

<i>synonym-stream</i>—a <i><a href="../26-glossary/s.xhtml#synonymstream">synonym stream</a></i>.

<p>
<i>symbol</i>—a <i><a href="../26-glossary/s.xhtml#symbol">symbol</a></i>.

</p></dd><dt><b>Description:</b></dt><dd>

Returns the <i><a href="../26-glossary/s.xhtml#symbol">symbol</a></i> whose <a href="../10-symbols/10.2.14-symbol-value.xhtml#DictEntry_symbol_value_688"><b>symbol-value</b></a> the <i>synonym-stream</i> is using.  

</dd><dt><b>See Also:</b></dt><dd>

<a href="21.2.38-make-synonym-stream.xhtml#DictEntry_make_synonym_1229"><b>make-synonym-stream</b></a>

</dd></dl>
