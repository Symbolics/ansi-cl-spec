<h3 id="DictEntry_array_rank_l_1003" class="entry"><span class="secno">15.2.25</span> <span class="names"><span id="array-rank-limit" data-symbol="array-rank-limit">array-rank-limit</span></span> <span class="kind">Constant Variable</span></h3>
<dl>


<dt><b>Constant Value:</b></dt><dd>

A positive

<i><a href="../26-glossary/f.xhtml#fixnum">fixnum</a></i>,

the exact magnitude of which is <i><a href="../26-glossary/i.xhtml#implementationdependent">implementation-dependent</a></i>,
but which is not less than <code>8</code>.

</dd><dt><b>Description:</b></dt><dd>


The upper exclusive bound on the <i><a href="../26-glossary/r.xhtml#rank">rank</a></i> of an <i><a href="../26-glossary/a.xhtml#array">array</a></i>.

</dd><dt><b>See Also:</b></dt><dd>

<a href="15.2.7-make-array.xhtml#DictEntry_make_array_985"><b>make-array</b></a>

</dd></dl>
