<h3 id="DictEntry_array_dimens_1002" class="entry" data-kind="constant-variable"><span class="secno">15.2.24</span> <span class="names"><span id="array-dimension-limit" data-symbol="array-dimension-limit">array-dimension-limit</span></span> <span class="kind">Constant Variable</span></h3>
<dl>


<dt data-section="constant-value"><b>Constant Value:</b></dt><dd>

A positive

<i><a href="../26-glossary/f.xhtml#fixnum">fixnum</a></i>,

the exact magnitude of which is <i><a href="../26-glossary/i.xhtml#implementationdependent">implementation-dependent</a></i>,
but which is not less than <code>1024</code>.

</dd><dt data-section="description"><b>Description:</b></dt><dd>


The upper exclusive bound on each individual <i><a href="../26-glossary/d.xhtml#dimension">dimension</a></i> of an <i><a href="../26-glossary/a.xhtml#array">array</a></i>.

</dd><dt data-section="see-also"><b>See Also:</b></dt><dd>

<a href="15.2.7-make-array.xhtml#DictEntry_make_array_985"><b>make-array</b></a>

</dd></dl>
