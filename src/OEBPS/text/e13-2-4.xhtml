<dl>


<dt><b>Supertypes:</b></dt><dd>

<a href="#DictEntry_extended_cha_887"><b>extended-char</b></a>,
<a href="e13-2-6.xhtml#DictEntry_character_889"><b>character</b></a>,
<a href="e4-4-16.xhtml#DictEntry_t_351"><b>t</b></a>

</dd><dt><b>Description:</b></dt><dd>

The <i><a href="g-t.xhtml#type">type</a></i> <a href="#DictEntry_extended_cha_887"><b>extended-char</b></a> is equivalent to the <i><a href="g-t.xhtml#type">type</a></i> <code>(and character (not base-char))</code>.

</dd><dt><b>Notes:</b></dt><dd>


The <i><a href="g-t.xhtml#type">type</a></i> <a href="#DictEntry_extended_cha_887"><b>extended-char</b></a> might 


have no <i><a href="g-e.xhtml#element">elements</a></i><sub>4</sub>
in <i><a href="g-i.xhtml#implementation">implementations</a></i> in which all <i><a href="g-c.xhtml#character">characters</a></i> are of <i><a href="g-t.xhtml#type">type</a></i> <a href="e13-2-2.xhtml#DictEntry_base_char_885"><b>base-char</b></a>.

</dd></dl>
