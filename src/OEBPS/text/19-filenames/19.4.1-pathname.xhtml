<h3 id="DictEntry_pathname_1144" class="entry"><span class="secno">19.4.1</span> <span class="names">pathname</span> <span class="kind">System Class</span></h3>
<dl>


<dt><b>Class Precedence List:</b></dt><dd>

<a href="#DictEntry_pathname_1144"><b>pathname</b></a>,
<a href="../4-types-and-classes/4.4.16-t.xhtml#DictEntry_t_351"><b>t</b></a>

</dd><dt><b>Description:</b></dt><dd>

A <i><a href="../26-glossary/p.xhtml#pathname">pathname</a></i> is a structured <i><a href="../26-glossary/o.xhtml#object">object</a></i> which represents a <i><a href="../26-glossary/f.xhtml#filename">filename</a></i>.

<p>
There are two kinds of <i><a href="../26-glossary/p.xhtml#pathname">pathnames</a></i>—<i><a href="../26-glossary/p.xhtml#physicalpathname">physical pathnames</a></i> and
<i><a href="../26-glossary/l.xhtml#logicalpathname">logical pathnames</a></i>.

</p></dd></dl>
