# Build, check and publish the web edition to GitHub Pages:
# https://symbolics.github.io/ansi-cl-spec/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EPUBCHECK_VERSION: 5.4.0
  EPUBCHECK_SHA256: 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-jre-headless python3-lxml python3-pytest
          curl -sSfL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v$EPUBCHECK_VERSION/epubcheck-$EPUBCHECK_VERSION.zip"
          echo "$EPUBCHECK_SHA256  /tmp/epubcheck.zip" | sha256sum -c --quiet
          unzip -q /tmp/epubcheck.zip -d /opt
          printf '#!/bin/sh\nexec java -jar /opt/epubcheck-%s/epubcheck.jar "$@"\n' "$EPUBCHECK_VERSION" \
            | sudo tee /usr/local/bin/epubcheck >/dev/null
          sudo chmod 755 /usr/local/bin/epubcheck

      - name: Tests
        run: python3 -m pytest -q

      # builds dist/ANSI-Common-Lisp.epub and dist/inventory.json, runs epubcheck and the audit
      - name: Check
        run: ./check.sh --require-anchors

      - name: Build site
        run: python3 tools/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
